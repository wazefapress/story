<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مغامرة الكلب رعد - قصة واقعية تفاعلية</title>
  
  <!-- Bootstrap 5 RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts: Tajawal -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #1b4332 0%, #111827 100%);
      display: flex;
      flex-direction: column;
    }

    .app-header {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      border-bottom: 2px solid #e9ecef;
      z-index: 10;
    }

    .brand-title {
      font-size: clamp(1rem, 2vh, 1.25rem);
      font-weight: 800;
      color: #2d6a4f;
    }

    .app-main {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    .story-card {
      width: 100%;
      max-width: 850px;
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      border: 3px solid #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      background: rgba(255, 255, 255, 0.98);
      overflow: hidden;
    }

    .card-header-compact {
      flex: 0 0 auto;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid #f0f0f0;
    }

    .progress {
      height: 8px;
      border-radius: 10px;
    }

    .image-container {
      flex: 1 1 auto;
      min-height: 120px;
      position: relative;
      overflow: hidden;
      margin: 8px 12px 0 12px;
      border-radius: 15px;
      background: #0b0c10;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
    }

    .image-container svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content-container {
      flex: 0 1 auto;
      padding: 10px 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .scene-title {
      font-size: clamp(1.1rem, 2.2vh, 1.5rem);
      font-weight: 800;
      color: #2d6a4f;
      margin-bottom: 4px;
    }

    .scene-text {
      font-size: clamp(0.9rem, 1.9vh, 1.25rem);
      line-height: 1.5;
      color: #374151;
      margin-bottom: 0;
      font-weight: 500;
    }

    .card-footer-compact {
      flex: 0 0 auto;
      padding: 8px 15px;
      background: #f8f9fa;
      border-top: 1px solid #eee;
    }

    .control-btn {
      font-size: clamp(0.85rem, 1.6vh, 1.05rem);
      border-radius: 50px;
      padding: 6px 18px;
    }

    .app-footer {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid #e9ecef;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="app-header py-2 px-3 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center p-0">
      <div class="brand-title d-flex align-items-center gap-2">
        <span class="fs-4">🐕</span>

<span>مغامرة الكلب رعد </span>
      </div>

      <div class="d-flex align-items-center gap-2">
 
        <button id="btnShare" class="btn btn-sm btn-primary rounded-pill px-3 d-flex align-items-center gap-1">
          <i class="bi bi-share-fill"></i>
          <span class="d-none d-sm-inline fw-bold">مشاركة</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN STORY VIEWPORT -->
  <main class="app-main">
    <div class="card story-card">
      
      <div class="card-header-compact">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span id="sceneBadge" class="badge bg-success px-3 py-1 rounded-pill">المشهد 1 من 20</span>
          <span id="progressText" class="small fw-bold text-secondary">5%</span>
        </div>
        <div class="progress">
          <div id="storyProgress" class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width: 5%;"></div>
        </div>
      </div>

      <!-- Vector Professional Dog Art Container -->
      <div id="imageContainer" class="image-container"></div>

      <div class="content-container">
        <h2 id="sceneTitle" class="scene-title">...</h2>
        <p id="sceneText" class="scene-text">...</p>
      </div>

      <div class="card-footer-compact d-flex justify-content-between align-items-center gap-2">
        <button id="btnPrev" class="btn btn-outline-success control-btn">
          <i class="bi bi-arrow-right"></i> السابق
        </button>
        <button id="btnRestart" class="btn btn-sm btn-light border text-secondary rounded-circle" style="width: 36px; height: 36px;" title="إعادة البدء">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
        <button id="btnNext" class="btn btn-success control-btn">
          التالي <i class="bi bi-arrow-left"></i>
        </button>
      </div>

    </div>
  </main>

  <footer class="app-footer py-2 px-3">
    <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-2 p-0">
      <div class="text-secondary small">
        تم التصميم والتطوير بواسطة 
        <a href="https://me.haythamzeidan.workers.dev/" class="text-decoration-none fw-bold text-success">هيثم زيدان</a>
      </div>
    </div>
  </footer>

<!-- JavaScript Logic & Professional Dog Engine -->
<script>
  const storyData = [
    { title: "1. الميدالية الضائعة 🪙", text: "في صباح مشمس، كان الكلب الوفي رعد يلهو قرب شجرة البلوط العتيقة، فعثر على ميدالية فضية براقة مربوطة بشريط أحمر أنيق!" },
    { title: "2. الاستعداد للرحلة 🎒", text: "تفحص رعد الميدالية باهتمام، ولاحظ نقشاً لخريطة صغيرة عليها، فقرر الاستعداد وحزم حقيبته الجلدية للبحث عن صاحبها الحقيقي." },
    { title: "3. بين التلال الخضراء ⛰️", text: "خطا رعد خطواته الواثقة بين التلال الخضراء المترامية الأطراف، بينما كانت النسائم اللطيفة تداعب فراءه الذهبي." },
    { title: "4. صوت استغاثة خافت 🐾", text: "بينما كان يسير بحذر، سمع رعد صوتاً خافتاً يشبه الاستغاثة يأتي من خلف مجموعة من الشجيرات الكثيفة." },
    { title: "5. لقاء الخروف الضائع 🐑", text: "اقترب رعد ليرى خروفاً صغيرًا ضائعاً يبكي بحرقة بعد أن ابتعد عن قطيعه وضاع منه الطريق." },
    { title: "6. المساعدة والشهامة 🤝", text: "لم يتردد رعد لحظة واحدة؛ استخدم حاسة قوية وقاد الخروف الصغير بلطف حتى أعاده سالماً إلى قطيعه ومراعيه." },
    { title: "7. هدية الراعي الوفي 🧣", text: "شكر الراعي الكلب رعد بحرارة على شهامته، وأهداه وشاحاً دافئاً وعصا خشبية قديمة تساعده في رحلته الطويلة." },
    { title: "8. الوصول إلى النهر الجاري 🌊", text: "تابع رعد مسيرته حتى وصل إلى نهر جاري ومياه صافية، ولم يكن هناك جسر مباشر للعبور." },
    { title: "9. عبور الحجارة الكبيرة 🪨", text: "استخدم رعد ذكاءه وقفز بخفة وثبات على الحجارة الكبيرة البارزة وسط النهر حتى عبر إلى الضفة الأخرى بأمان." },
    { title: "10. الضفة الأخرى المزهرة 🌸", text: "وصل رعد إلى الضفة المقابلة المغطاة بالزهور البرية الملونة واستنشق عبيرها المنعش بسعادة بالغة." },
    { title: "11. العصفور الحارس 🐦", text: "التقى هناك بعصفور حكيم وقف على فرع شجرة وقال له بود: لن تجتاز الغابة حتى تحلّ لغزي!" },
    { title: "12. لغز الصداقة والوفاء 🤔", text: "سأله العصفور: ما هو الكنز الذي لا يُقدر بثمن ويزداد بقاءً كلما شاركته مع الآخرين؟ فقال رعد بثقة: إنه الوفاء والصداقة!" },
    { title: "13. مفتاح الكوخ القديم 🔑", text: "أعجب العصفور بحكمة رعد وسلمه مفتاحاً خشبياً عتيقاً يفتح باب الكوخ الغامض أعلى الجبل." },
    { title: "14. الوصول للكوخ الغامض 🏡", text: "صعد رعد المنحدر حتى وصل إلى الكوخ الخشبي القديم، وأدخل المفتاح الخشبي ودار القفل بانسيابية تامة." },
    { title: "15. فتح الباب والداخل الدافئ ✨", text: "انفتح الباب ببطء ليكشف عن مكان دافئ مليء بالرفوف المنظمة والكتب القديمة المضيئة." },
    { title: "16. صندوق الكنز العتيق 📦", text: "في منتصف الغرفة، وجد رعد صندوقاً خشبياً فاخراً ينبعث منه ضوء دافئ وجميل." },
    { title: "17. مفاجأة الكنز الحقيقي 🦴", text: "فتح رعد الصندوق.. ليكتشف أنه مليء بالألعاب المفضلة، والعظام اللذيذة، ووجبات الطعام الشهية!" },
    { title: "18. دعوة الأصدقاء للاحتفال 🎉", text: "أدرك رعد أن الكنز الحقيقي هو مشاركة الفرحة، فدعا الخروف الصغير وبقية حيوانات الغابة للاحتفال." },
    { title: "19. وقت الغروب الهادئ 🌅", text: "قضت الحيوانات وقتاً ممتعاً بالمرح واللعب حتى غربت الشمس وصبغت السماء بألوان ساحرة." },
    { title: "20. أحلام سعيدة يا رعد 🌙", text: "عاد رعد إلى بيته الدافئ، أغمض عينيه بارتياح وقال: أروع مغامرة هي تلك التي تنشر فيها الخير." }
  ];

  const dogDefs = `
    <defs>
      <!-- تدرج احترافي لفراء الكلب (ذهبي دافئ) -->
      <radialGradient id="dogFur" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#dda15e"/>
        <stop offset="60%" stop-color="#bc6c25"/>
        <stop offset="90%" stop-color="#9b581e"/>
        <stop offset="100%" stop-color="#603813"/>
      </radialGradient>
      <linearGradient id="dogTail" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#dda15e"/>
        <stop offset="100%" stop-color="#fefae0"/>
      </linearGradient>
      <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#48cae4"/>
        <stop offset="50%" stop-color="#0077b6"/>
        <stop offset="100%" stop-color="#03045e"/>
      </linearGradient>
    </defs>
  `;

  // كلب واقعي واحترافي تماماً (أذنان مندليتان، جسم قوي، ملامح وفية، ذيل يتحرك)
  const realisticDog = (x, y, scale = 1, pose = "sit", flip = 1) => {
    let tailPos = '';
    if (pose === "alert") {
      tailPos = `M-25,10 Q-50,-10 -40,-25`;
    } else {
      tailPos = `M-25,10 Q-50,35 -35,25`;
    }

    return `
      <g transform="translate(${x},${y}) scale(${scale * flip}, ${scale})">
        <!-- الذيل الكثيف المعبر عن الوفاء -->
        <path d="${tailPos}" fill="none" stroke="url(#dogTail)" stroke-width="7" stroke-linecap="round"/>
        
        <!-- الأرجل الخلفية -->
        <ellipse cx="-15" cy="20" rx="12" ry="9" fill="#9b581e" stroke="#3d2817" stroke-width="1"/>
        
        <!-- الجسم القوي للكلب -->
        <ellipse cx="0" cy="12" rx="30" ry="18" fill="url(#dogFur)" stroke="#3d2817" stroke-width="1.5"/>
        
        <!-- البطن والصدر بلون فاتح -->
        <path d="M-18,18 Q5,26 22,14 Q8,22 -18,18 Z" fill="#fefae0" opacity="0.85"/>
        
        <!-- الرأس الواقعي -->
        <circle cx="15" cy="-2" r="14" fill="url(#dogFur)" stroke="#3d2817" stroke-width="1.5"/>
        
        <!-- الأذنان المندليتان المميزتان للكلاب -->
        <path d="M8,-10 Q2,-25 12,-15" fill="#603813" stroke="#3d2817" stroke-width="1.2"/>
        <path d="M22,-10 Q32,-22 25,-12" fill="#603813" stroke="#3d2817" stroke-width="1.2"/>
        
        <!-- العين الودودة والذكية -->
        <circle cx="19" cy="-4" r="3.5" fill="#111"/>
        <circle cx="20" cy="-5" r="1.2" fill="#fff"/>
        
        <!-- الأنف الأسود البارز -->
        <ellipse cx="28" cy="-1" rx="4" ry="3" fill="#111"/>
        
        <!-- اللسان البارز أحياناً للبهجة -->
        <path d="M26,3 Q28,8 30,3 Z" fill="#ff758f"/>
        
        <!-- الشاربين الدقيقين -->
        <path d="M24,4 L34,7 M24,6 L35,10" stroke="#fefae0" stroke-width="0.8" opacity="0.7"/>
      </g>
    `;
  };

  // خروف صغير لطيف
  const cuteLamb = (x, y, scale = 1, flip = 1) => `
    <g transform="translate(${x},${y}) scale(${scale * flip}, ${scale})">
      <ellipse cx="0" cy="8" rx="16" ry="12" fill="#fff" stroke="#ccc" stroke-width="1"/>
      <circle cx="10" cy="2" r="9" fill="#f8f9fa" stroke="#ccc" stroke-width="1"/>
      <ellipse cx="15" cy="-2" rx="4" ry="6" fill="#333"/>
      <circle cx="12" cy="0" r="1.5" fill="#111"/>
      <rect x="-8" y="15" width="4" height="12" rx="2" fill="#fff"/>
      <rect x="4" y="15" width="4" height="12" rx="2" fill="#fff"/>
    </g>
  `;

  function generateDogStorySVG(index) {
    const sceneNum = index + 1;
    let sceneContent = "";

    switch(sceneNum) {
      case 1: // الميدالية الفضية قرب شجرة البلوط
        sceneContent = `
          <rect width="800" height="500" fill="#90e0ef"/>
          <circle cx="700" cy="90" r="70" fill="#ffb703" opacity="0.8"/>
          <path d="M60,500 L150,230 C90,140 70,70 210,45 C370,20 430,130 370,230 L430,500 Z" fill="#2d6a4f"/>
          <path d="M110,500 C100,340 130,230 150,200" stroke="#3d2817" stroke-width="40" stroke-linecap="round"/>
          <path d="M0,370 Q400,310 800,370 L800,500 L0,500 Z" fill="#55a630"/>
          <!-- الميدالية الفضية -->
          <g transform="translate(470, 360)">
            <circle cx="0" cy="0" r="18" fill="#e0e1dd" stroke="#778da9" stroke-width="3"/>
            <path d="M-6,-12 Q0,-20 6,-12" fill="none" stroke="#e63946" stroke-width="3"/>
          </g>
          ${realisticDog(320, 340, 1.2, "alert")}
        `;
        break;

      case 2: // الحقيبة الجلدية
        sceneContent = `
          <rect width="800" height="500" fill="#fefae0"/>
          <rect x="100" y="280" width="600" height="220" fill="#dda15e" stroke="#bc6c25" stroke-width="3"/>
          <rect x="220" y="190" width="130" height="140" rx="15" fill="#582f0e" stroke="#2b2d42" stroke-width="3"/>
          <rect x="250" y="230" width="70" height="50" rx="5" fill="#bc6c25"/>
          ${realisticDog(410, 260, 1.25, "alert")}
        `;
        break;

      case 3: // بين التلال الخضراء
        sceneContent = `
          <rect width="800" height="500" fill="#52b788"/>
          <path d="M0,380 Q400,280 800,380 L800,500 L0,500 Z" fill="#40916c"/>
          <path d="M0,420 Q400,340 800,420 L800,500 L0,500 Z" fill="#2d6a4f"/>
          ${realisticDog(380, 350, 1.1, "alert")}
        `;
        break;

      case 4: // صوت الاستغاثة
        sceneContent = `
          <rect width="800" height="500" fill="#40916c"/>
          <path d="M80,500 L180,100 L280,500 Z" fill="#1b4332"/>
          <path d="M350,500 C350,260 800,260 800,500 Z" fill="#0b090a"/>
          ${realisticDog(220, 370, 1.2, "alert")}
          <text x="510" y="220" font-size="50" fill="#fff" font-weight="bold">مساعدة...!</text>
        `;
        break;

      case 5: // لقاء الخروف الصغير
        sceneContent = `
          <rect width="800" height="500" fill="#74c69d"/>
          <path d="M0,390 Q400,330 800,390 L800,500 L0,500 Z" fill="#40916c"/>
          ${cuteLamb(490, 400, 1.4)}
          ${realisticDog(270, 360, 1.2, "alert")}
        `;
        break;

      case 6: // إرشاد الخروف للقطيع
        sceneContent = `
          <rect width="800" height="500" fill="#95d5b2"/>
          <path d="M0,390 Q400,330 800,390 L800,500 L0,500 Z" fill="#52b788"/>
          ${realisticDog(320, 360, 1.2, "alert")}
          ${cuteLamb(520, 390, 1.2, -1)}
          ${cuteLamb(600, 410, 1, -1)}
        `;
        break;

      case 7: // هدية الراعي الوفي
        sceneContent = `
          <rect width="800" height="500" fill="#b7e4c7"/>
          <path d="M0,390 Q400,330 800,390 L800,500 L0,500 Z" fill="#52b788"/>
          <!-- وشاح دافئ -->
          <g transform="translate(380, 330)">
            <path d="M-10,0 Q10,15 30,0" fill="none" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>
          </g>
          ${realisticDog(380, 350, 1.2, "alert")}
        `;
        break;

      case 8: // الوصول إلى النهر الجاري
        sceneContent = `
          <rect width="800" height="500" fill="#2d6a4f"/>
          <path d="M220,0 Q420,250 120,500 L800,500 L800,0 Z" fill="url(#riverGrad)"/>
          ${realisticDog(100, 360, 1.2, "alert")}
        `;
        break;

      case 9: // عبور الحجارة الكبيرة
        sceneContent = `
          <rect width="800" height="500" fill="url(#riverGrad)"/>
          <ellipse cx="300" cy="350" rx="40" ry="20" fill="#6c757d" stroke="#343a40" stroke-width="2"/>
          <ellipse cx="500" cy="280" rx="45" ry="22" fill="#6c757d" stroke="#343a40" stroke-width="2"/>
          ${realisticDog(450, 230, 1.1, "alert")}
        `;
        break;

      case 10: // الضفة الأخرى المزهرة
        sceneContent = `
          <rect width="800" height="500" fill="#0077b6"/>
          <path d="M0,300 Q400,250 800,300 L800,500 L0,500 Z" fill="#55a630"/>
          <circle cx="200" cy="380" r="18" fill="#ff5964"/>
          <circle cx="600" cy="400" r="20" fill="#ffb703"/>
          ${realisticDog(400, 320, 1.3, "alert")}
        `;
        break;

      case 11: // العصفور الحارس
        sceneContent = `
          <rect width="800" height="500" fill="#40916c"/>
          <path d="M0,370 Q400,310 800,370 L800,500 L0,500 Z" fill="#2d6a4f"/>
          <path d="M550,500 L550,200 L580,200 L580,500 Z" fill="#3d2817"/>
          <!-- عصفور -->
          <circle cx="565" cy="180" r="12" fill="#dda15e"/>
          ${realisticDog(250, 370, 1.2, "alert")}
        `;
        break;

      case 12: // حل اللغز
        sceneContent = `
          <rect width="800" height="500" fill="#2d6a4f"/>
          ${realisticDog(200, 370, 1.2, "alert")}
          <g transform="translate(400, 180)">
            <rect x="-70" y="-20" width="140" height="40" rx="10" fill="#fff"/>
            <text x="0" y="5" font-size="18" fill="#000" text-anchor="middle">الوفاء والصداقة!</text>
          </g>
        `;
        break;

      case 13: // المفتاح الخشبي
        sceneContent = `
          <rect width="800" height="500" fill="#52b788"/>
          ${realisticDog(240, 350, 1.2, "alert")}
          <!-- مفتاح خشبي -->
          <g transform="translate(420, 250)">
            <circle cx="0" cy="0" r="16" fill="none" stroke="#bc6c25" stroke-width="4"/>
            <rect x="14" y="-3" width="35" height="6" fill="#bc6c25"/>
          </g>
        `;
        break;

      case 14: // الكوخ الغامض
        sceneContent = `
          <rect width="800" height="500" fill="#1b4332"/>
          <path d="M200,500 L400,120 L600,500 Z" fill="#582f0e"/>
          <rect x="330" y="330" width="140" height="170" fill="#bc6c25"/>
          ${realisticDog(210, 400, 1.1, "alert")}
        `;

  }

  let currentIndex = 0;
  const sceneTitle = document.getElementById("sceneTitle");
  const sceneText = document.getElementById("sceneText");
  const imageContainer = document.getElementById("imageContainer");
  const sceneBadge = document.getElementById("sceneBadge");
  const storyProgress = document.getElementById("storyProgress");
  const progressText = document.getElementById("progressText");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnRestart = document.getElementById("btnRestart");
  const btnShare = document.getElementById("btnShare");
 
  let deferredPrompt = null;

  function renderScene(index) {
    currentIndex = index;
    const scene = storyData[currentIndex];
    
    sceneTitle.innerText = scene.title;
    sceneText.innerText = scene.text;
    imageContainer.innerHTML = generateDogStorySVG(currentIndex);

    const progressPercent = Math.round(((currentIndex + 1) / storyData.length) * 100);
    sceneBadge.innerText = `المشهد ${currentIndex + 1} من ${storyData.length}`;
    storyProgress.style.width = `${progressPercent}%`;
    progressText.innerText = `${progressPercent}%`;

    btnPrev.disabled = currentIndex === 0;
    if (currentIndex === storyData.length - 1) {
      btnNext.innerHTML = 'النهاية 🎉';
      btnNext.classList.replace('btn-success', 'btn-primary');
    } else {
      btnNext.innerHTML = 'التالي <i class="bi bi-arrow-left"></i>';
      btnNext.classList.replace('btn-primary', 'btn-success');
    }
  }

  btnNext.onclick = () => {
    if (currentIndex < storyData.length - 1) renderScene(currentIndex + 1);
    else renderScene(0);
  };
  btnPrev.onclick = () => { if (currentIndex > 0) renderScene(currentIndex - 1); };
  btnRestart.onclick = () => renderScene(0);

  btnShare.onclick = async () => {
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'قصة مغامرة الكلب رعد',
          text: 'اقرأ قصة الأطفال التفاعلية الجديدة للكلب رعد!',
          url: window.location.href,
        });
      } catch (err) {}
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('تم النسخ بنجاح!');
    }
  };

  

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') btnNext.click();
    if (e.key === 'ArrowRight') btnPrev.click();
  });

  window.onload = () => renderScene(0);
</script>
