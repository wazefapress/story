    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function sharePage() { 
            if (navigator.share) navigator.share({title: document.title, url: window.location.href}); 
        }

        // كود برمجة زر التثبيت (PWA Install Prompt)
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // منع المتصفح من إظهار نافذة التثبيت التلقائية
            e.preventDefault();
            // الاحتفاظ بالحدث لاستخدامه لاحقاً عند النقر على الزر
            deferredPrompt = e;
            // إظهار زر التثبيت للمستخدم
            installBtn.style.display = 'inline-block';

            installBtn.addEventListener('click', () => {
                // إخفاء الزر بعد النقر
                installBtn.style.display = 'none';
                // إظهار نافذة التثبيت
                deferredPrompt.prompt();
                // انتظار رد المستخدم على نافذة التثبيت
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('تم قبول تثبيت التطبيق');
                    } else {
                        console.log('تم إلغاء تثبيت التطبيق');
                    }
                    deferredPrompt = null;
                });
            });
        });
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then((reg) => console.log('Service Worker registered successfully', reg))
                .catch((err) => console.log('Service Worker registration failed', err));
        });
    }
</script>
