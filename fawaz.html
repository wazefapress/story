<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مغامرة الذئب فواز - قصة واقعية تفاعلية</title>
  
  <!-- Bootstrap 5 RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts: Tajawal -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #1d3557 0%, #111827 100%);
      display: flex;
      flex-direction: column;
    }

    .app-header {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      border-bottom: 2px solid #e9ecef;
      z-index: 10;
    }

    .brand-title {
      font-size: clamp(1rem, 2vh, 1.25rem);
      font-weight: 800;
      color: #457b9d;
    }

    .app-main {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    .story-card {
      width: 100%;
      max-width: 850px;
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      border: 3px solid #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      background: rgba(255, 255, 255, 0.98);
      overflow: hidden;
    }

    .card-header-compact {
      flex: 0 0 auto;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid #f0f0f0;
    }

    .progress {
      height: 8px;
      border-radius: 10px;
    }

    .image-container {
      flex: 1 1 auto;
      min-height: 120px;
      position: relative;
      overflow: hidden;
      margin: 8px 12px 0 12px;
      border-radius: 15px;
      background: #0b0c10;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
    }

    .image-container svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content-container {
      flex: 0 1 auto;
      padding: 10px 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .scene-title {
      font-size: clamp(1.1rem, 2.2vh, 1.5rem);
      font-weight: 800;
      color: #1d3557;
      margin-bottom: 4px;
    }

    .scene-text {
      font-size: clamp(0.9rem, 1.9vh, 1.25rem);
      line-height: 1.5;
      color: #374151;
      margin-bottom: 0;
      font-weight: 500;
    }

    .card-footer-compact {
      flex: 0 0 auto;
      padding: 8px 15px;
      background: #f8f9fa;
      border-top: 1px solid #eee;
    }

    .control-btn {
      font-size: clamp(0.85rem, 1.6vh, 1.05rem);
      border-radius: 50px;
      padding: 6px 18px;
    }

    .app-footer {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid #e9ecef;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="app-header py-2 px-3 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center p-0">
      <div class="brand-title d-flex align-items-center gap-2">
        <span class="fs-4">🐺</span>
<span>مغامرة الذئب فواز </span>
      </div>

      <div class="d-flex align-items-center gap-2">
      
        <button id="btnShare" class="btn btn-sm btn-primary rounded-pill px-3 d-flex align-items-center gap-1">
          <i class="bi bi-share-fill"></i>
          <span class="d-none d-sm-inline fw-bold">مشاركة</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN STORY VIEWPORT -->
  <main class="app-main">
    <div class="card story-card">
      
      <div class="card-header-compact">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span id="sceneBadge" class="badge bg-primary px-3 py-1 rounded-pill" style="background-color: #1d3557 !important;">المشهد 1 من 20</span>
          <span id="progressText" class="small fw-bold text-secondary">5%</span>
        </div>
        <div class="progress">
          <div id="storyProgress" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 5%; background-color: #1d3557;"></div>
        </div>
      </div>

      <!-- Vector Professional Wolf Art Container -->
      <div id="imageContainer" class="image-container"></div>

      <div class="content-container">
        <h2 id="sceneTitle" class="scene-title">...</h2>
        <p id="sceneText" class="scene-text">...</p>
      </div>

      <div class="card-footer-compact d-flex justify-content-between align-items-center gap-2">
        <button id="btnPrev" class="btn btn-outline-primary control-btn" style="color: #1d3557; border-color: #1d3557;">
          <i class="bi bi-arrow-right"></i> السابق
        </button>
        <button id="btnRestart" class="btn btn-sm btn-light border text-secondary rounded-circle" style="width: 36px; height: 36px;" title="إعادة البدء">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
        <button id="btnNext" class="btn text-white control-btn" style="background-color: #1d3557;">
          التالي <i class="bi bi-arrow-left"></i>
        </button>
      </div>

    </div>
  </main>

  <footer class="app-footer py-2 px-3">
    <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-2 p-0">
      <div class="text-secondary small">
        تم التصميم والتطوير بواسطة 
        <a href="https://me.haythamzeidan.workers.dev/" class="text-decoration-none fw-bold" style="color: #1d3557;">هيثم زيدان</a>
      </div>
    </div>
  </footer>

<!-- JavaScript Logic & Professional Wolf Engine -->
<script>
  const storyData = [
    { title: "1. الكريستالة الفضية البراقة 💎", text: "في صباح هادئ بأعماق الغابة الصنوبرية، كان الذئب الحكيم فواز يتجول بثقة، فعثر على كريستالة فضية سحرية تنير ببريق دافئ تحت شجرة عملاقة!" },
    { title: "2. الاستعداد للرحلة الاستكشافية 🎒", text: "تفحص فواز الكريستالة بتركيز، ولاحظ نقشاً لخريطة طريق سرية تقود نحو قمة الجبل الغامض، فجهز حقيبته وانطلق بشجاعة." },
    { title: "3. السير بين أشجار الصنوبر 🌲", text: "بدأت رحلة فواز واثقة بين أشجار الصنوبر العالية، بينما كانت النسائم الباردة تداعب فرائه الرمادي اللامع." },
    { title: "4. صوت نداء خافت 🐾", text: "بينما كان يسير بالقرب من جدول الماء، سمع فواز صوتاً خافتاً يشبه الاستغاثة يأتي من خلف الصخور الكبيرة." },
    { title: "5. لقاء الثعلب الصغير 🦊", text: "اقترب فواز ليرى ثعلباً صغيراً علقت ذيله بين جذور شجرة قوية ولا يستطيع الحراك." },
    { title: "6. مساعدة الأصدقاء 🤝", text: "لم يتردد الذئب الشجاع لحظة واحدة؛ بل استخدم قوته بحكمة وحرر الثعلب الصغير بكل لطف وأمان." },
    { title: "7. هدية الثعلب السحرية ✨", text: "شكر الثعلب الذئب فواز بحرارة، وأهداه ريشة متوهجة تنير له عتمة الممرات الجبلية المظلمة." },
    { title: "8. الوصول إلى الوادي العريض 🌊", text: "تابع فواز مسيره حتى وصل إلى مجرى مائي عريض وصافي، ولم يكن هناك جسر ظاهر للعبور." },
    { title: "9. عبور الخشب الملقى 🪵", text: "استخدم فواز ذكاءه وخفة خطاه، وعبر فوق جذع شجرة ضخم سقط عرضاً فوق النهر ليصل للضفة الأخرى." },
    { title: "10. الضفة المقابلة المزهرة 🌿", text: "وصل الذئب إلى الضفة الأخرى المغطاة بالورود البرية وأخذ استراحة قصيرة مستمتعاً بجمال الطبيعة." },
    { title: "11. البومة الحكيمة 🦉", text: "التقى هناك ببومة حكيمة تقف على صخرة عالية فقالت لها بود: لن تجتاز القمة حتى تحل لغزي!" },
    { title: "12. لغز الشجاعة والحكمة 🤔", text: "سألته البومة: ما هو السلاح الحقيقي الذي يفتح أصعب الأبواب ويحمي الأصدقاء؟ فقال فواز بثقة: إنها الشجاعة المقترنة بالحكمة والتعاون!" },
    { title: "13. مفتاح البوابة الحجرية 🔑", text: "ابتسمت البومة لإجابة فواز الذكية وسلمته مفتاحاً حجرياً فريداً يفتح باب المغارة السرية." },
    { title: "14. صعود قمة الجبل العالي ⛰️", text: "صعد فواز المنحدر بخطوات ثابتة حتى وصل إلى باب المغارة الصخري العتيق، وأدخل المفتاح فدار بانسيابية تامة." },
    { title: "15. الداخل الدافئ والمضيء ✨", text: "انفتح الباب ببطء ليكشف عن قاعة داخلية رائعة مليئة بالمعرفة والكنوز الطبيعية." },
    { title: "16. صندوق الكنز العتيق 📦", text: "في وسط المغارة، وجد فواز صندوقاً خشبياً قديماً ينبعث منه ضوء دافئ ومريح." },
    { title: "17. مفاجأة الكنز الحقيقي 🌰", text: "فتح فواز الصندوق.. ليكتشف أنه مليء بأجود أنواع الثمار والمكسرات المغذية لحيوانات الغابة بأكملها!" },
    { title: "18. دعوة أصدقاء الغابة للاحتفال 🎉", text: "أدرك فواز أن الكنز الحقيقي هو مشاركة الخير مع الجميع، فدع الثعلب والبومة وبقية أصدقائه للاحتفال معا." },
    { title: "19. وقت الغروب الهادئ 🌅", text: "قضت الحيوانات وقتاً ممتعاً بالبهجة والسلام حتى غربت الشمس وصبغت السماء بألوان الأفق الساحرة." },
    { title: "20. أحلام سعيدة يا فواز 🌙", text: "عاد الذئب فواز إلى عرينه الدافئ بالغا، أغمض عينيه بارتياح وقال: القوة الحقيقية تُستخدم دائماً لحماية ونفع الآخرين." }
  ];

  const wolfDefs = `
    <defs>
      <!-- تدرج احترافي لفراء الذئب (رمادي فاخر وداكن) -->
      <radialGradient id="wolfFur" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#8d99ae"/>
        <stop offset="70%" stop-color="#4a4e69"/>
        <stop offset="100%" stop-color="#2b2d42"/>
      </radialGradient>
      <linearGradient id="wolfEars" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4a4e69"/>
        <stop offset="100%" stop-color="#1d3557"/>
      </linearGradient>
    </defs>
  `;

  // ذئب واقعي واحترافي (رأس مدبب، أذنان حادتان، فراء رمادي أنيق، ذيل كثيف)
  const realisticWolf = (x, y, scale = 1, pose = "walk", flip = 1) => {
    return `
      <g transform="translate(${x},${y}) scale(${scale * flip}, ${scale})">
        <!-- الذيل الكثيف -->
        <path d="M-18,2 Q-32,5 -28,15 Q-20,18 -15,10 Z" fill="url(#wolfFur)" stroke="#111" stroke-width="1"/>
        
        <!-- الأرجل -->
        <path d="M-10,10 L-14,24 M-4,10 L-6,24 M4,10 L6,24 M12,10 L14,24" fill="none" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round"/>

        <!-- الجسم الرئيسي -->
        <ellipse cx="0" cy="5" rx="16" ry="11" fill="url(#wolfFur)" stroke="#111" stroke-width="1.5"/>

        <!-- الرأس والرقبة -->
        <circle cx="12" cy="0" r="9" fill="url(#wolfFur)" stroke="#111" stroke-width="1.5"/>
        
        <!-- الأذنان الحادتان -->
        <polygon points="8,-7 14,-17 18,-6" fill="url(#wolfEars)" stroke="#111" stroke-width="1"/>
        <polygon points="12,-7 16,-15 20,-6" fill="url(#wolfEars)" stroke="#111" stroke-width="1"/>

        <!-- الأنف والفم الحاد -->
        <polygon points="18,-2 23,1 18,4" fill="#111"/>

        <!-- العين الذكية اللامعة -->
        <circle cx="15" cy="-2" r="1.5" fill="#ffd700"/>
        <circle cx="15.5" cy="-2.5" r="0.5" fill="#111"/>
      </g>
    `;
  };

  // ثعلب صغير لطيف
  const cuteFox = (x, y, scale = 1, flip = 1) => `
    <g transform="translate(${x},${y}) scale(${scale * flip}, ${scale})">
      <ellipse cx="0" cy="8" rx="14" ry="10" fill="#e07a5f" stroke="#333" stroke-width="1.2"/>
      <circle cx="10" cy="0" r="7" fill="#e07a5f" stroke="#333" stroke-width="1"/>
      <polygon points="12,-7 16,-14 18,-4" fill="#d62828"/>
      <circle cx="13" cy="-1" r="1.2" fill="#111"/>
    </g>
  `;

  function generateWolfStorySVG(index) {
    const sceneNum = index + 1;
    let sceneContent = "";

    switch(sceneNum) {
      case 1: // الكريستالة الفضية تحت شجرة الصنوبر العملاقة
        sceneContent = `
          <rect width="800" height="500" fill="#a8dadc"/>
          <circle cx="700" cy="90" r="70" fill="#ffb703" opacity="0.8"/>
          <path d="M0,370 Q400,310 800,370 L800,500 L0,500 Z" fill="#1d3557"/>
          <!-- الكريستالة الفضية -->
          <g transform="translate(470, 360)">
            <polygon points="0,-12 10,0 0,12 -10,0" fill="#f8f9fa" stroke="#457b9d" stroke-width="2"/>
            <circle cx="0" cy="0" r="3" fill="#4ea8de"/>
          </g>
          ${realisticWolf(320, 350, 1.2, "walk")}
        `;
        break;

      case 2: // الحقيبة الاستكشافية
        sceneContent = `
          <rect width="800" height="500" fill="#fefae0"/>
          <rect x="100" y="280" width="600" height="220" fill="#dda15e" stroke="#bc6c25" stroke-width="3"/>
          <rect x="220" y="190" width="130" height="140" rx="15" fill="#1d3557" stroke="#457b9d" stroke-width="3"/>
          <rect x="250" y="230" width="70" height="50" rx="5" fill="#f8f9fa"/>
          ${realisticWolf(410, 270, 1.25, "walk")}
        `;
        break;

      case 3: // بين أشجار الصنوبر
        sceneContent = `
          <rect width="800" height="500" fill="#457b9d"/>
          <path d="M150,500 L120,80 L140,500 Z" fill="#1d3557"/>
          <path d="M350,500 L380,100 L360,500 Z" fill="#1d3557"/>
          <path d="M600,500 L640,120 L620,500 Z" fill="#1d3557"/>
          <path d="M0,420 Q400,360 800,420 L800,500 L0,500 Z" fill="#1d3557"/>
          ${realisticWolf(400, 390, 1.2, "walk")}
        `;
        break;

      case 4: // صوت النداء خلف الصخور
        sceneContent = `
          <rect width="800" height="500" fill="#1d3557"/>
          <path d="M300,500 C300,280 600,280 600,500 Z" fill="#457b9d"/>
          ${realisticWolf(220, 420, 1.2, "walk")}
          <text x="510" y="220" font-size="50" fill="#fff" font-weight="bold">مساعدة...!</text>
        `;
        break;

      case 5: // لقاء الثعلب الصغير
        sceneContent = `
          <rect width="800" height="500" fill="#457b9d"/>
          <path d="M0,390 Q400,330 800,390 L800,500 L0,500 Z" fill="#1d3557"/>
          ${cuteFox(490, 400, 1.4)}
          ${realisticWolf(260, 410, 1.2, "walk")}
        `;
        break;

      case 6: // مساعدة الثعلب
        sceneContent = `
          <rect width="800" height="500" fill="#a8dadc"/>
          <path d="M0,390 Q400,330 800,390 L800,500 L0,500 Z" fill="#457b9d"/>
          ${realisticWolf(320, 410, 1.2, "walk")}
          ${cuteFox(520, 360, 1.2, -1)}
        `;
        break;

      case 7: // هدية الريشة المتوهجة
        sceneContent = `
          <rect width="800" height="500" fill="#f1faee"/>
          <path d="M0,390 Q400,330 800,390 L800,500 L0,500 Z" fill="#a8dadc"/>
          <!-- ريشة متوهجة -->
          <circle cx="420" cy="280" r="15" fill="#4ea8de" opacity="0.6"/>
          ${realisticWolf(260, 410, 1.2, "walk")}
          ${cuteFox(550, 330, 1.2, -1)}
        `;
        break;

      case 8: // الوصول إلى الوادي العريض
        sceneContent = `
          <rect width="800" height="500" fill="#1d3557"/>
          <path d="M220,0 Q420,250 120,500 L800,500 L800,0 Z" fill="#48cae4"/>
          ${realisticWolf(100, 410, 1.2, "walk")}
        `;
        break;

      case 9: // عبور الجذع الخشبي
        sceneContent = `
          <rect width="800" height="500" fill="#0077b6"/>
          <circle cx="400" cy="250" r="140" fill="#90e0ef" opacity="0.3"/>
          <path d="M250,320 L550,280 L550,300 L250,340 Z" fill="#582f0e" stroke="#111" stroke-width="1.5"/>
          ${realisticWolf(380, 275, 1.1, "walk")}
        `;
        break;

      case 10: // الضفة المقابلة المزهرة
        sceneContent = `
          <rect width="800" height="500" fill="#0096c7"/>
          <path d="M0,300 Q400,250 800,300 L800,500 L0,500 Z" fill="#1d3557"/>
          <circle cx="200" cy="380" r="18" fill="#e63946"/>
          <circle cx="600" cy="400" r="20" fill="#ffb703"/>
          ${realisticWolf(400, 320, 1.3, "walk")}
        `;
        break;

      case 11: // البومة الحكيمة
        sceneContent = `
          <rect width="800" height="500" fill="#457b9d"/>
          <path d="M0,370 Q400,310 800,370 L800,500 L0,500 Z" fill="#1d3557"/>
          ${realisticWolf(220, 410, 1.2, "walk")}
          <!-- بومة -->
          <ellipse cx="580" cy="400" rx="14" ry="16" fill="#3d2817" stroke="#111" stroke-width="1"/>
          <circle cx="575" cy="395" r="4" fill="#ffd700"/>
        `;
        break;

      case 12: // حل لغز الشجاعة والحكمة
        sceneContent = `
          <rect width="800" height="500" fill="#1d3557"/>
          ${realisticWolf(200, 410, 1.2, "walk")}
          <g transform="translate(400, 180)">
            <rect x="-140" y="-20" width="280" height="40" rx="10" fill="#fff"/>
            <text x="0" y="5" font-size="16" fill="#000" text-anchor="middle">الشجاعة المقترنة بالحكمة والتعاون!</text>
          </g>
        `;
        break;

      case 13: // المفتاح الحجري الفريد
        sceneContent = `
          <rect width="800" height="500" fill="#a8dadc"/>
          ${realisticWolf(240, 410, 1.2, "walk")}
          <g transform="translate(420, 250)">
            <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#457b9d" stroke-width="4"/>
            <rect x="10" y="-3" width="30" height="6" fill="#457b9d"/>
          </g>
        `;
        break;

      case 14: // قمة الجبل وباب المغارة
        sceneContent = `
          <rect width="800" height="500" fill="#1d3557"/>
          <path d="M120,500 L400,60 L680,500 Z" fill="#457b9d"/>
          <path d="M300,500 L300,330 A100,100 0 0,1 500,330 L500,500 Z" fill="#0b0c10"/>
          ${realisticWolf(210, 420, 1.1, "walk")}
        `;
        break;

      case 15: // الداخل الدافئ والمضيء للمغارة
        sceneContent = `
          <rect width="800" height="500" fill="#2b2d42"/>
          <circle cx="200" cy="380" r="55" fill="#457b9d" opacity="0.7"/>
          <circle cx="600" cy="350" r="65" fill="#457b9d" opacity="0.7"/>
          ${realisticWolf(380, 420, 1.2, "walk")}
        `;
        break;

      case 16: // صندوق الكنز العتيق
        sceneContent = `
          <rect width="800" height="500" fill="#1d3557"/>
          <g transform="translate(350, 330)">
            <circle cx="50" cy="0" r="130" fill="#ffd700" opacity="0.2"/>
            <rect x="-30" y="20" width="160" height="90" rx="10" fill="#582f0e" stroke="#ffd700" stroke-width="4"/>
            <path d="M-30,20 Q50,-40 130,20 Z" fill="#7f4f24" stroke="#ffd700" stroke-width="4"/>
          </g>
          ${realisticWolf(190, 420, 1.2, "walk")}
        `;
        break;

      case 17: // الثمار والمكسرات المغذية
        sceneContent = `
          <rect width="800" height="500" fill="#457b9d"/>
          <g transform="translate(350, 280)">
            <rect x="-20" y="50" width="140" height="70" rx="5" fill="#582f0e" stroke="#ffd700" stroke-width="3"/>
            <circle cx="25" cy="30" r="8" fill="#e63946"/>
            <circle cx="65" cy="25" r="7" fill="#ffb703"/>
          </g>
          ${realisticWolf(210, 410, 1.2, "walk")}
        `;
        break;

      case 18: // الاحتفال مع الأصدقاء
        sceneContent = `
          <rect width="800" height="500" fill="#dda15e"/>
          <path d="M0,390 Q400,330 800,390 L800,500 L0,500 Z" fill="#bc6c25"/>
          ${realisticWolf(340, 410, 1.2, "walk")}
          ${cuteFox(580, 390, 1.3, -1)}
        `;
        break;

      case 19: // رحلة العودة عند الغروب
        sceneContent = `
          <rect width="800" height="500" fill="#e76f51"/>
          <circle cx="400" cy="240" r="95" fill="#ffb703"/>
          <path d="M0,390 Q400,310 800,390 L800,500 L0,500 Z" fill="#1f2937"/>
          ${realisticWolf(400, 400, 1.2, "walk")}
        `;
        break;

      case 20: // أحلام سعيدة في العرين الدافئ
        sceneContent = `
          <rect width="800" height="500" fill="#111827"/>
          <circle cx="680" cy="100" r="45" fill="#f8f9fa"/>
          <!-- العرين الدافئ -->
          <ellipse cx="400" cy="370" rx="160" ry="65" fill="#1d3557" stroke="#457b9d" stroke-width="3"/>
          ${realisticWolf(360, 360, 1, "walk")}
          <text x="400" y="240" font-size="28" fill="#90e0ef" font-family="sans-serif">Zzz...</text>
        `;
        break;
    }

    return `<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${wolfDefs}${sceneContent}</svg>`;
  }

  let currentIndex = 0;
  const sceneTitle = document.getElementById("sceneTitle");
  const sceneText = document.getElementById("sceneText");
  const imageContainer = document.getElementById("imageContainer");
  const sceneBadge = document.getElementById("sceneBadge");
  const storyProgress = document.getElementById("storyProgress");
  const progressText = document.getElementById("progressText");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnRestart = document.getElementById("btnRestart");
  const btnShare = document.getElementById("btnShare");

  let deferredPrompt = null;

  function renderScene(index) {
    currentIndex = index;
    const scene = storyData[currentIndex];
    
    sceneTitle.innerText = scene.title;
    sceneText.innerText = scene.text;
    imageContainer.innerHTML = generateWolfStorySVG(currentIndex);

    const progressPercent = Math.round(((currentIndex + 1) / storyData.length) * 100);
    sceneBadge.innerText = `المشهد ${currentIndex + 1} من ${storyData.length}`;
    storyProgress.style.width = `${progressPercent}%`;
    progressText.innerText = `${progressPercent}%`;

    btnPrev.disabled = currentIndex === 0;
    if (currentIndex === storyData.length - 1) {
      btnNext.innerHTML = 'النهاية 🎉';
      btnNext.classList.replace('text-white', 'text-dark');
      btnNext.style.backgroundColor = '#ffb703';
    } else {
      btnNext.innerHTML = 'التالي <i class="bi bi-arrow-left"></i>';
      btnNext.classList.replace('text-dark', 'text-white');
      btnNext.style.backgroundColor = '#1d3557';
    }
  }

  btnNext.onclick = () => {
    if (currentIndex < storyData.length - 1) renderScene(currentIndex + 1);
    else renderScene(0);
  };
  btnPrev.onclick = () => { if (currentIndex > 0) renderScene(currentIndex - 1); };
  btnRestart.onclick = () => renderScene(0);

  btnShare.onclick = async () => {
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'قصة مغامرة الذئب فواز',
          text: 'اقرأ قصة الأطفال التفاعلية الجديدة للذئب فواز!',
          url: window.location.href,
        });
      } catch (err) {}
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('تم النسخ بنجاح!');
    }
  };

  

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') btnNext.click();
    if (e.key === 'ArrowRight') btnPrev.click();
  });

  window.onload = () => renderScene(0);
</script>
</body>
</html>
