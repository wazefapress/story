<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قصة: جوهر الأمانة</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #283618 0%, #111827 100%);
      display: flex;
      flex-direction: column;
    }

    .app-header {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      border-bottom: 2px solid #e9ecef;
      z-index: 10;
    }

    .brand-title {
      font-size: clamp(1rem, 2vh, 1.25rem);
      font-weight: 800;
      color: #606c38;
    }

    .app-main {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    .story-card {
      width: 100%;
      max-width: 850px;
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      border: 3px solid #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      background: rgba(255, 255, 255, 0.98);
      overflow: hidden;
    }

    .card-header-compact {
      flex: 0 0 auto;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid #f0f0f0;
    }

    .progress {
      height: 8px;
      border-radius: 10px;
    }

    .image-container {
      flex: 1 1 auto;
      min-height: 120px;
      position: relative;
      overflow: hidden;
      margin: 8px 12px 0 12px;
      border-radius: 15px;
      background: #fefae0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.1);
    }

    .content-container {
      flex: 0 1 auto;
      padding: 15px 20px;
      text-align: center;
    }

    .scene-title {
      font-size: clamp(1.2rem, 2.5vh, 1.8rem);
      font-weight: 800;
      color: #283618;
      margin-bottom: 10px;
    }

    .scene-text {
      font-size: clamp(1rem, 2vh, 1.4rem);
      line-height: 1.6;
      color: #374151;
      margin-bottom: 0;
    }

    .card-footer-compact {
      flex: 0 0 auto;
      padding: 10px 15px;
      background: #f8f9fa;
      border-top: 1px solid #eee;
    }

    .control-btn {
      font-size: 1rem;
      border-radius: 50px;
      padding: 8px 24px;
    }
  </style>
</head>
<body>

  <header class="app-header py-2 px-3 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center p-0">
      <div class="brand-title d-flex align-items-center gap-2">
        <span>💼</span>
        <span>جوهر الأمانة</span>
      </div>
      <button id="btnShare" class="btn btn-sm btn-success rounded-pill px-3">
        <i class="bi bi-share-fill"></i> مشاركة
      </button>
    </div>
  </header>

  <main class="app-main">
    <div class="card story-card">
      <div class="card-header-compact">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span id="sceneBadge" class="badge bg-secondary rounded-pill">المشهد 1</span>
          <span id="progressText" class="small fw-bold">5%</span>
        </div>
        <div class="progress">
          <div id="storyProgress" class="progress-bar" style="width: 5%; background-color: #606c38;"></div>
        </div>
      </div>

      <div id="imageContainer" class="image-container">
        <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <rect width="400" height="300" fill="#fefae0"/>
          <text x="50%" y="50%" font-size="30" text-anchor="middle" fill="#606c38">قصة جوهر الأمانة</text>
        </svg>
      </div>

      <div class="content-container">
        <h2 id="sceneTitle" class="scene-title">...</h2>
        <p id="sceneText" class="scene-text">...</p>
      </div>

      <div class="card-footer-compact d-flex justify-content-between align-items-center">
        <button id="btnPrev" class="btn btn-outline-secondary control-btn">السابق</button>
        <button id="btnNext" class="btn btn-success control-btn">التالي</button>
      </div>
    </div>
  </main>

<script>
  const storyData = [
    { title: '1. الوظيفة الجديدة 💼', text: "بعد سنوات من الدراسة الجادة، حصل 'عمر' على وظيفة في شركة كبيرة. كانت مهمته الأولى هي إدارة ملفات مالية سرية وحساسة." },
    { title: '2. الظرف المنسي ✉️', text: 'في أحد الأيام، وأثناء ترتيبه لمكتب مديره المغادر، وجد عمر ظرفاً سميكاً سقط خلف الخزانة، بداخله مبلغ كبير من المال ووثائق مهمة.' },
    { title: '3. صراع الضمير ⚖️', text: 'وقف عمر يتأمل الظرف. تذكر ديونه المتراكمة واحتياجات أسرته. كان الشيطان يوسوس له بأن هذا المال قد يكون مفتاحه لحل مشاكله.' },
    { title: '4. ثقل الأمانة 🔍', text: 'شعر عمر بثقل الأمانة على كاهله. أدرك أن كسب الرزق الحلال، وإن كان صعباً، هو الطريق الوحيد للراحة النفسية والبركة.' },
    { title: '5. القرار الصعب 🚶‍♂️', text: 'حسم عمر أمره وتوجه مباشرة إلى مكتب المدير العام. لم يخبر أحداً عما وجده، أراد أن تكون أمانته خالصة لوجه الله.' },
    { title: '6. لحظة المواجهة 👔', text: "دخل عمر إلى مكتب المدير، وأمام الجميع، وضع الظرف على المكتب قائلاً: 'سيدي، لقد وجدت هذا خلف خزانة المدير السابق'." },
    { title: '7. دهشة المدير 😮', text: 'تسمر المدير في مكانه بدهشة. لم يكن يعلم بفقدان هذا الظرف، وبدا عليه التأثر الشديد بموقف عمر النبيل.' },
    { title: '8. اختبار النزاهة 🌟', text: 'كشف المدير لعمر أن هذا الموقف كان اختباراً وضعته الإدارة لتقييم مدى أمانة الموظفين الجدد في التعامل مع الملفات الحساسة.' },
    { title: '9. الترقية المستحقة 📈', text: 'لم يكتفِ المدير بشكر عمر، بل قرر ترقيته على الفور ليكون مسؤولاً عن قسم التدقيق المالي، ثقةً منه في نزاهته.' },
    { title: '10. الكنز الحقيقي 🏆', text: 'خرج عمر من المكتب وهو يشعر بزهو النصر. لم يربح المال فحسب، بل ربح ثقة الجميع واحترامهم، وهو الكنز الذي لا يفنى.' },
    { title: '11. رسالة إلى الزملاء 💬', text: "في اجتماع الفريق التالي، شارك عمر قصته مع زملائه، مؤكداً أن 'الأمانة ليست مجرد كلمة، بل هي سلوك يومي يحدد قيمتنا الحقيقية'." },
    { title: '12. الرضا الداخلي 🍃', text: 'عاد عمر إلى بيته في ذلك المساء، يغمره شعور بالرضا والسكينة لم يعرفه من قبل، فقد كان مرتاح الضمير.' },
    { title: '13. البركة في الرزق 🤲', text: 'بعد فترة وجيزة، وجد عمر أن أموره تيسرت بشكل عجيب، وشعر ببركة لم يعهدها في دخله وراتبه الجديد.' },
    { title: '14. أثر الموقف 💡', text: 'أصبحت قصة عمر مثلاً يُضرب في الشركة عن النزاهة، وبدأ الكثير من الزملاء يراجعون تصرفاتهم في العمل.' },
    { title: '15. حياة مطمئنة 🏠', text: 'عرف عمر أن قيمته لا تقاس بما يملك في جيبه، بل بما يحمله في قلبه من قيم ومبادئ ثابته لا تتزعزع.' },
    { title: '16. بناء المستقبل ✨', text: 'مع مرور السنوات، أصبح عمر مديراً ناجحاً، وكان دائماً يختار لفريقه الأشخاص الذين يتسمون بالأمانة والصدق.' },
    { title: '17. القدوة الحسنة 🧑‍🏫', text: 'لم ينسَ عمر أبداً ذلك اليوم الذي كاد أن يزل فيه، فكان دائماً يذكّر الشباب بضرورة الحفاظ على الأمانة.' },
    { title: '18. الحكمة من التجربة 🧠', text: 'الدرس الذي تعلمه عمر هو أن الأمانة هي حصن الإنسان، وأن الله يعوض من يصدق معه بكل خير.' },
    { title: '19. نهاية الرحلة 🌅', text: 'في ختام مسيرته المهنية، نظر عمر إلى ما حققه، وأدرك أن الأمانة كانت هي المحرك الأساسي لكل نجاحاته.' },
    { title: '20. خلود الأثر 🌙', text: 'بقي أثر عمر طيباً في نفوس الجميع، تاركاً إرثاً من النزاهة والأمانة للأجيال القادمة.' }
  ];
  
  let currentIndex = 0;
  const sceneTitle = document.getElementById("sceneTitle");
  const sceneText = document.getElementById("sceneText");
  const sceneBadge = document.getElementById("sceneBadge");
  const storyProgress = document.getElementById("storyProgress");
  const progressText = document.getElementById("progressText");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnShare = document.getElementById("btnShare");

  function renderScene(index) {
    currentIndex = index;
    const scene = storyData[currentIndex];
    sceneTitle.innerText = scene.title;
    sceneText.innerText = scene.text;
    
    const progressPercent = Math.round(((currentIndex + 1) / storyData.length) * 100);
    sceneBadge.innerText = `المشهد ${currentIndex + 1} من ${storyData.length}`;
    storyProgress.style.width = `${progressPercent}%`;
    progressText.innerText = `${progressPercent}%`;

    btnPrev.disabled = currentIndex === 0;
    btnNext.innerText = currentIndex === storyData.length - 1 ? "نهاية القصة" : "التالي";
  }

  btnNext.onclick = () => {
    if (currentIndex < storyData.length - 1) renderScene(currentIndex + 1);
  };
  btnPrev.onclick = () => { if (currentIndex > 0) renderScene(currentIndex - 1); };

  btnShare.onclick = async () => {
    const shareData = {
      title: 'قصة جوهر الأمانة',
      text: 'اقرأ هذه القصة الهادفة عن الأمانة:',
      url: window.location.href,
    };
    if (navigator.share) {
      try {
        await navigator.share(shareData);
      } catch (err) {
        console.log('Error sharing:', err);
      }
    } else {
      try {
        await navigator.clipboard.writeText(window.location.href);
        alert('تم نسخ رابط القصة إلى الحافظة بنجاح!');
      } catch (err) {
        alert('تعذر نسخ الرابط.');
      }
    }
  };

  window.onload = () => renderScene(0);
</script>

  <footer class="app-footer py-3 text-center" style="background: #f8f9fa; border-top: 1px solid #e9ecef; font-size: 0.9rem;">
    <div class="text-secondary">
      تم التصميم والتطوير بواسطة 
      <a href="https://www.patreon.com/haythamzeidan" class="text-decoration-none fw-bold" style="color: #606c38;">هيثم زيدان</a>
      | 
      <a href="https://github.com/wazefapress" target="_blank" class="text-decoration-none fw-bold text-dark">
        <i class="bi bi-github"></i> GitHub
      </a>
    </div>
  </footer>

</body>
</html>
