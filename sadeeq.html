<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قصة: الصديق الحقيقي</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #283618 0%, #111827 100%);
      display: flex;
      flex-direction: column;
    }

    .app-header {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      border-bottom: 2px solid #e9ecef;
      z-index: 10;
    }

    .brand-title {
      font-size: clamp(1rem, 2vh, 1.25rem);
      font-weight: 800;
      color: #606c38;
    }

    .app-main {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    .story-card {
      width: 100%;
      max-width: 850px;
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      border: 3px solid #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      background: rgba(255, 255, 255, 0.98);
      overflow: hidden;
    }

    .card-header-compact {
      flex: 0 0 auto;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid #f0f0f0;
    }

    .progress {
      height: 8px;
      border-radius: 10px;
    }

    .image-container {
      flex: 1 1 auto;
      min-height: 120px;
      position: relative;
      overflow: hidden;
      margin: 8px 12px 0 12px;
      border-radius: 15px;
      background: #fefae0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.1);
    }

    .content-container {
      flex: 0 1 auto;
      padding: 15px 20px;
      text-align: center;
    }

    .scene-title {
      font-size: clamp(1.2rem, 2.5vh, 1.8rem);
      font-weight: 800;
      color: #283618;
      margin-bottom: 10px;
    }

    .scene-text {
      font-size: clamp(1rem, 2vh, 1.4rem);
      line-height: 1.6;
      color: #374151;
      margin-bottom: 0;
    }

    .card-footer-compact {
      flex: 0 0 auto;
      padding: 10px 15px;
      background: #f8f9fa;
      border-top: 1px solid #eee;
    }

    .control-btn {
      font-size: 1rem;
      border-radius: 50px;
      padding: 8px 24px;
    }
  </style>
</head>
<body>

  <header class="app-header py-2 px-3 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center p-0">
      <div class="brand-title d-flex align-items-center gap-2">
     <span>🤝</span> <span>الصديق الحقيقي</span>
      </div>
      <button id="btnShare" class="btn btn-sm btn-success rounded-pill px-3">
        <i class="bi bi-share-fill"></i> مشاركة
      </button>
    </div>
  </header>

  <main class="app-main">
    <div class="card story-card">
      <div class="card-header-compact">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span id="sceneBadge" class="badge bg-secondary rounded-pill">المشهد 1</span>
          <span id="progressText" class="small fw-bold">5%</span>
        </div>
        <div class="progress">
          <div id="storyProgress" class="progress-bar" style="width: 5%; background-color: #606c38;"></div>
        </div>
      </div>

      <div id="imageContainer" class="image-container">
        <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <rect width="400" height="300" fill="#fefae0"/>
          <text x="50%" y="50%" font-size="30" text-anchor="middle" fill="#606c38">قصة الصديق الحقيقي</text>
        </svg>
      </div>

      <div class="content-container">
        <h2 id="sceneTitle" class="scene-title">...</h2>
        <p id="sceneText" class="scene-text">...</p>
      </div>

      <div class="card-footer-compact d-flex justify-content-between align-items-center">
        <button id="btnPrev" class="btn btn-outline-secondary control-btn">السابق</button>
        <button id="btnNext" class="btn btn-success control-btn">التالي</button>
      </div>
    </div>
  </main>

<script>
  const storyData = [
    { title: '1. الرحلة الطويلة 🌲', text: "كان 'أحمد' و'سعيد' صديقين مقربين منذ الطفولة. قررا يوماً خوض مغامرة في الغابة للبحث عن بحيرة مخفية بعيدة." },
    { title: '2. التحدي الأول 🐻', text: 'بينما كانا يسيران، ظهر دب ضخم فجأة في طريقهما. شعر أحمد بالخوف وتجمد في مكانه.' },
    { title: '3. التصرف السريع 🏃‍♂️', text: 'دون تفكير، تسلق سعيد شجرة قريبة بسرعة فائقة، وترك أحمد وحيداً في مواجهة الخطر.' },
    { title: '4. الحيلة الذكية 💡', text: 'تذكر أحمد نصيحة قديمة بأن الدببة لا تهاجم الموتى، فاستلقى على الأرض وحبس أنفاسه تماماً.' },
    { title: '5. رحيل الخطر 🐾', text: 'اقترب الدب من أحمد، شمّه قليلاً ثم ابتعد. بعد أن غادر الدب، نزل سعيد من الشجرة وهو يلهث.' },
    { title: '6. السؤال المحرج ❓', text: 'قال سعيد بفضول: "ماذا همس الدب في أذنك يا أحمد؟" أجابه أحمد بهدوء: "أخبرني أن لا أثق بصديق يتركني في وقت الشدة."' },
    { title: '7. لحظة الصمت 🤐', text: 'شعر سعيد بالخجل الشديد ولم يجد ما يرد به، فقد أدرك أن أفعاله كشفت حقيقة مشاعره.' },
    { title: '8. معنى الصداقة 🤝', text: 'تعلم أحمد في تلك اللحظة أن الصديق الحقيقي ليس من يشاركك أوقات المرح فقط، بل من يثبت بجانبك حين تشتد الأزمات.' },
    { title: '9. الدرس القاسي 🎓', text: 'انتهت الرحلة لكنها تركت في قلبهما درساً لن ينسياه؛ فالصداقة ميثاق يختبره الزمان والمواقف.' },
    { title: '10. جوهر الصديق 🏆', text: 'أدرك أحمد أن الصديق الصادق كنز لا يقدر بثمن، وبدأ يختار رفاقه بعناية أكبر من ذلك اليوم.' }
  ];
  
  let currentIndex = 0;
  const sceneTitle = document.getElementById("sceneTitle");
  const sceneText = document.getElementById("sceneText");
  const sceneBadge = document.getElementById("sceneBadge");
  const storyProgress = document.getElementById("storyProgress");
  const progressText = document.getElementById("progressText");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnShare = document.getElementById("btnShare");

  function renderScene(index) {
    currentIndex = index;
    const scene = storyData[currentIndex];
    sceneTitle.innerText = scene.title;
    sceneText.innerText = scene.text;
    
    const progressPercent = Math.round(((currentIndex + 1) / storyData.length) * 100);
    sceneBadge.innerText = `المشهد ${currentIndex + 1} من ${storyData.length}`;
    storyProgress.style.width = `${progressPercent}%`;
    progressText.innerText = `${progressPercent}%`;

    btnPrev.disabled = currentIndex === 0;
    btnNext.innerText = currentIndex === storyData.length - 1 ? "نهاية القصة" : "التالي";
  }

  btnNext.onclick = () => {
    if (currentIndex < storyData.length - 1) renderScene(currentIndex + 1);
  };
  btnPrev.onclick = () => { if (currentIndex > 0) renderScene(currentIndex - 1); };

  btnShare.onclick = async () => {
    const shareData = {
      title: 'قصة الصديق الحقيقي',
      text: 'اقرأ هذه القصة الهادفة عن الصديق الحقيقي:',
      url: window.location.href,
    };
    if (navigator.share) {
      try {
        await navigator.share(shareData);
      } catch (err) {
        console.log('Error sharing:', err);
      }
    } else {
      try {
        await navigator.clipboard.writeText(window.location.href);
        alert('تم نسخ رابط القصة إلى الحافظة بنجاح!');
      } catch (err) {
        alert('تعذر نسخ الرابط.');
      }
    }
  };

  window.onload = () => renderScene(0);
</script>

  <footer class="app-footer py-3 text-center" style="background: #f8f9fa; border-top: 1px solid #e9ecef; font-size: 0.9rem;">
    <div class="text-secondary">
      تم التصميم والتطوير بواسطة 
      <a href="https://www.patreon.com/haythamzeidan" class="text-decoration-none fw-bold" style="color: #606c38;">هيثم زيدان</a>
      | 
      <a href="https://github.com/wazefapress" target="_blank" class="text-decoration-none fw-bold text-dark">
        <i class="bi bi-github"></i> GitHub
      </a>
    </div>
  </footer>

</body>
</html>
