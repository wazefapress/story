<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مغامرة السلحفاء سلومة</title>
  
  <!-- Bootstrap 5 RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts: Tajawal -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #1b4332 0%, #111827 100%);
      display: flex;
      flex-direction: column;
    }

    .app-header {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      border-bottom: 2px solid #e9ecef;
      z-index: 10;
    }

    .brand-title {
      font-size: clamp(1rem, 2vh, 1.25rem);
      font-weight: 800;
      color: #2d6a4f;
    }

    .app-main {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    .story-card {
      width: 100%;
      max-width: 850px;
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      border: 3px solid #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      background: rgba(255, 255, 255, 0.98);
      overflow: hidden;
    }

    .card-header-compact {
      flex: 0 0 auto;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid #f0f0f0;
    }

    .progress {
      height: 8px;
      border-radius: 10px;
    }

    .image-container {
      flex: 1 1 auto;
      min-height: 120px;
      position: relative;
      overflow: hidden;
      margin: 8px 12px 0 12px;
      border-radius: 15px;
      background: #0b0c10;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
    }

    .image-container svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content-container {
      flex: 0 1 auto;
      padding: 10px 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .scene-title {
      font-size: clamp(1.1rem, 2.2vh, 1.5rem);
      font-weight: 800;
      color: #2d6a4f;
      margin-bottom: 4px;
    }

    .scene-text {
      font-size: clamp(0.9rem, 1.9vh, 1.25rem);
      line-height: 1.5;
      color: #374151;
      margin-bottom: 0;
      font-weight: 500;
    }

    .card-footer-compact {
      flex: 0 0 auto;
      padding: 8px 15px;
      background: #f8f9fa;
      border-top: 1px solid #eee;
    }

    .control-btn {
      font-size: clamp(0.85rem, 1.6vh, 1.05rem);
      border-radius: 50px;
      padding: 6px 18px;
    }

    .app-footer {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid #e9ecef;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="app-header py-2 px-3 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center p-0">
      <div class="brand-title d-flex align-items-center gap-2">
        <span class="fs-4">🐢</span>
        <span>مغامرة السلحفاء سلومة</span>
      </div>

      <div class="d-flex align-items-center gap-2">
        
        <button id="btnShare" class="btn btn-sm btn-success rounded-pill px-3 d-flex align-items-center gap-1">
          <i class="bi bi-share-fill"></i>
          <span class="d-none d-sm-inline fw-bold">مشاركة</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN STORY VIEWPORT -->
  <main class="app-main">
    <div class="card story-card">
      
      <div class="card-header-compact">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span id="sceneBadge" class="badge bg-success px-3 py-1 rounded-pill" style="background-color: #2d6a4f !important;">المشهد 1 من 20</span>
          <span id="progressText" class="small fw-bold text-secondary">5%</span>
        </div>
        <div class="progress">
          <div id="storyProgress" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 5%; background-color: #2d6a4f;"></div>
        </div>
      </div>

      <!-- Vector Professional Turtle Art Container -->
      <div id="imageContainer" class="image-container"></div>

      <div class="content-container">
        <h2 id="sceneTitle" class="scene-title">...</h2>
        <p id="sceneText" class="scene-text">...</p>
      </div>

      <div class="card-footer-compact d-flex justify-content-between align-items-center gap-2">
        <button id="btnPrev" class="btn btn-outline-success control-btn" style="color: #2d6a4f; border-color: #2d6a4f;">
          <i class="bi bi-arrow-right"></i> السابق
        </button>
        <button id="btnRestart" class="btn btn-sm btn-light border text-secondary rounded-circle" style="width: 36px; height: 36px;" title="إعادة البدء">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
        <button id="btnNext" class="btn text-white control-btn" style="background-color: #2d6a4f;">
          التالي <i class="bi bi-arrow-left"></i>
        </button>
      </div>

    </div>
  </main>

  <footer class="app-footer py-2 px-3">
    <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-2 p-0">
      <div class="text-secondary small">
        تم التصميم والتطوير بواسطة 
        <a href="https://me.haythamzeidan.workers.dev/" class="text-decoration-none fw-bold" style="color: #2d6a4f;">هيثم زيدان</a>
      </div>
    </div>
  </footer>

<!-- JavaScript Logic & Professional Turtle Engine -->
<script>
  const storyData = [
    { title: "1. الصدفة الذهبية البراقة 🐚", text: "في صباح هادئ وجميل بحديقة الغابة، كانت السلحفاء الحكيمة سلومة تسير بخطوات بطيئة وثابتة، فعثرت على قطعة صدفة ذهبية براقة تحت ورقة شجر ضخمة!" },
    { title: "2. الاستعداد للرحلة 🎒", text: "تفحصت سلومة الصدفة باهتمام بالغ، ولاحظت نقشاً لخريطة طريق سرية عليها، فجهزت حقيبتها المصغرة وانطلقت بكل عزم وصبر." },
    { title: "3. بين الأعشاب الطويلة 🌿", text: "بدأت سلومة رحلتها متجاوزة سيقان العشب الأخضر الطويل ببطء وثبات، بينما كانت خيوط الندى تتلألأ حولها كاللؤلؤ." },
    { title: "4. صوت نداء خافت 🐾", text: "بينما كانت تسير بحذر، سمعت سلومة صوت استغاثة خافت قادم من خلف جذع شجرة عتيقة." },
    { title: "5. لقاء الطائر الصغير 🐦", text: "اقتربت سلومة لتعثر على طائر صغير علق جناحه بين الأغصان ولا يستطيع الطيران." },
    { title: "6. مساعدة الأصدقاء 🤝", text: "بفضل صبرها وهدوئها، استخدمت سلومة رأسها بحرافة ودلفت الأغصان حتى حررت الطائر الصغير سالماً." },
    { title: "7. هدية الطائر السحرية ✨", text: "شكر الطائر السلحفاء سلومة بحرارة، وأهداها ريشة براقة تنير لها عتمة الطرقات المظلمة." },
    { title: "8. الوصول إلى جدول الماء الصافي 🌊", text: "تابعت سلومة مسيرها الهادئ حتى وصلت إلى جدول مائي عذب وصغير، ولم يكن هناك جسر للعبور." },
    { title: "9. عبور الماء بذكاء 🍃", text: "استخدمت سلومة ورقة شجر خفيفة كقارب صغير، وجدفت بصبرها المعهود حتى عبرت الجدول إلى الضفة المقابلة." },
    { title: "10. ضفة الغابة المزهرة 🌸", text: "وصلت سلومة إلى الضفة الأخرى المغطاة بالزهور البرية العطرة وأخذت استراحة قصيرة مستمتعة بنسيم الهواء العليل." },
    { title: "11. الضفدع الحكيم ناصر 🐸", text: "التقت هناك بالضفدع الحكيم ناصر الذي قال لها بابتسامة: لن تجتازي بوابة الوادي حتى تحلّي لغزي." },
    { title: "12. لغز الصبر والنجاح 🤔", text: "سأل ناصر: ما هو السلاح الأضمن الذي يصل بك إلى أبعد الأهداف دون تسرع؟ فقالت سلومة بثقة: إنه الصبر والثبات والاستمرار!" },
    { title: "13. مفتاح البوابة الذهبي 🔑", text: "أعجب الضفدع بحكمة سلومة وسلمها مفتاحاً صغيراً لامعاً يفتح بوابة الوادي القديمة." },
    { title: "14. الوصول لبوابة الوادي 🚪", text: "صعدت سلومة التل ببطء وثبات حتى وُصلت إلى باب الوادي الحجري العتيق، وأدخلت المفتاح فدار القفل بانسيابية تامة." },
    { title: "15. الداخل الدافئ المنظم ✨", text: "انفتح الباب ببطء ليكشف عن مغارة دافئة ومنظمة بدقة فائقة مليئة بالمؤن والكتب القديمة." },
    { title: "16. صندوق الكنز العتيق 📦", text: "في أعمق قاعة بالمغارة، وجدت سلومة صندوقاً خشبياً صغيراً ينبعث منه ضوء دافئ وساحر." },
    { title: "17. مفاجأة الكنز الحقيقي 🍓", text: "فتحت سلومة الصندوق.. ليكتشف الجميع أنه مليء بأجود أنواع الثمار والبذور المغذية لحيوانات الغابة بأكملها!" },
    { title: "18. دعوة الأصدقاء للاحتفال 🎉", text: "أدركت سلومة أن الكنز الحقيقي يكمن في مشاركة الخير، فدعت الطائر والضفدع وبقية أصدقائها للاحتفال." },
    { title: "19. وقت الغروب الهادئ 🌅", text: "قضت الحيوانات وقتاً ممتعاً بالبهجة حتى غربت الشمس وصبغت السماء بألوان الأفق الساحرة." },
    { title: "20. أحلام سعيدة يا سلومة 🌙", text: "عادت سلومة إلى ركنها الدافئ داخل المغارة، أغمضت عينيها بارتياح وقالت: بالصبر والثبات تُحقق أعظم الأحلام." }
  ];

  const turtleDefs = `
    <defs>
      <!-- تدرج احترافي لدرع السلحفاء (أخضر زمردي وبني عتيق) -->
      <radialGradient id="turtleShell" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#52b788"/>
        <stop offset="70%" stop-color="#2d6a4f"/>
        <stop offset="100%" stop-color="#1b4332"/>
      </radialGradient>
      <linearGradient id="turtleSkin" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#74c69d"/>
        <stop offset="100%" stop-color="#2d6a4f"/>
      </linearGradient>
    </defs>
  `;

  // سلحفاء واقعية واحترافية (درع بيضاوي منقوش، رأس هادئ، أربعة أقدام قصيرة)
  const realisticTurtle = (x, y, scale = 1, pose = "walk", flip = 1) => {
    return `
      <g transform="translate(${x},${y}) scale(${scale * flip}, ${scale})">
        <!-- الأرجل القصيرة -->
        <ellipse cx="-12" cy="12" rx="6" ry="4" fill="url(#turtleSkin)" stroke="#111" stroke-width="1"/>
        <ellipse cx="12" cy="12" rx="6" ry="4" fill="url(#turtleSkin)" stroke="#111" stroke-width="1"/>
        <ellipse cx="-14" cy="-2" rx="5" ry="3" fill="url(#turtleSkin)" stroke="#111" stroke-width="1"/>
        
        <!-- الدرع الرئيسي للسلحفاء -->
        <ellipse cx="0" cy="2" rx="22" ry="16" fill="url(#turtleShell)" stroke="#111" stroke-width="1.5"/>
        <ellipse cx="0" cy="2" rx="16" ry="11" fill="none" stroke="#d8f3dc" stroke-width="1" opacity="0.6"/>
        
        <!-- الرأس الهادئ الممدود -->
        <circle cx="22" cy="2" r="7" fill="url(#turtleSkin)" stroke="#111" stroke-width="1"/>
        
        <!-- العين السوداء اللامعة -->
        <circle cx="24" cy="0" r="1.5" fill="#111"/>
        <circle cx="24.5" cy="-0.5" r="0.5" fill="#fff"/>
      </g>
    `;
  };

  // طائر صغير لطيف
  const cuteBird = (x, y, scale = 1, flip = 1) => `
    <g transform="translate(${x},${y}) scale(${scale * flip}, ${scale})">
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#4ea8de" stroke="#111" stroke-width="1"/>
      <circle cx="8" cy="-4" r="5" fill="#4ea8de" stroke="#111" stroke-width="1"/>
      <polygon points="12,-4 17,-2 12,0" fill="#ffb703"/>
      <path d="M-10,-2 Q-16,-10 -6,-6" fill="none" stroke="#111" stroke-width="1.5"/>
    </g>
  `;

  // ضفدع لطيف
  const cuteFrog = (x, y, scale = 1, flip = 1) => `
    <g transform="translate(${x},${y}) scale(${scale * flip}, ${scale})">
      <ellipse cx="0" cy="5" rx="12" ry="9" fill="#52b788" stroke="#111" stroke-width="1.2"/>
      <circle cx="-5" cy="-2" r="5" fill="#52b788" stroke="#111" stroke-width="1"/>
      <circle cx="5" cy="-2" r="5" fill="#52b788" stroke="#111" stroke-width="1"/>
      <circle cx="-5" cy="-3" r="2" fill="#fff"/>
      <circle cx="5" cy="-3" r="2" fill="#fff"/>
      <circle cx="-5" cy="-3" r="1" fill="#111"/>
      <circle cx="5" cy="-3" r="1" fill="#111"/>
    </g>
  `;

  function generateTurtleStorySVG(index) {
    const sceneNum = index + 1;
    let sceneContent = "";

    switch(sceneNum) {
      case 1: // الصدفة الذهبية تحت ورقة الشجر الكبيرة
        sceneContent = `
          <rect width="800" height="500" fill="#90e0ef"/>
          <circle cx="700" cy="90" r="70" fill="#ffb703" opacity="0.8"/>
          <path d="M0,370 Q400,310 800,370 L800,500 L0,500 Z" fill="#2d6a4f"/>
          <!-- الصدفة الذهبية -->
          <g transform="translate(470, 360)">
            <ellipse cx="0" cy="0" rx="14" ry="10" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
            <circle cx="0" cy="0" r="4" fill="#ff477e"/>
          </g>
          ${realisticTurtle(320, 350, 1.2, "walk")}
        `;
        break;

      case 2: // الحقيبة المصغرة
        sceneContent = `
          <rect width="800" height="500" fill="#fefae0"/>
          <rect x="100" y="280" width="600" height="220" fill="#dda15e" stroke="#bc6c25" stroke-width="3"/>
          <rect x="220" y="190" width="130" height="140" rx="15" fill="#2d6a4f" stroke="#1b4332" stroke-width="3"/>
          <rect x="250" y="230" width="70" height="50" rx="5" fill="#fefae0"/>
          ${realisticTurtle(410, 270, 1.25, "walk")}
        `;
        break;

      case 3: // بين الأعشاب الطويلة
        sceneContent = `
          <rect width="800" height="500" fill="#b7e4c7"/>
          <path d="M150,500 L120,80 L140,500 Z" fill="#2d6a4f"/>
          <path d="M350,500 L380,100 L360,500 Z" fill="#2d6a4f"/>
          <path d="M600,500 L640,120 L620,500 Z" fill="#2d6a4f"/>
          <path d="M0,420 Q400,360 800,420 L800,500 L0,500 Z" fill="#52b788"/>
          ${realisticTurtle(400, 390, 1.2, "walk")}
        `;
        break;

      case 4: // صوت النداء خلف جذع الشجرة
        sceneContent = `
          <rect width="800" height="500" fill="#2d6a4f"/>
          <path d="M300,500 C300,280 600,280 600,500 Z" fill="#582f0e"/>
          ${realisticTurtle(220, 420, 1.2, "walk")}
          <text x="510" y="220" font-size="50" fill="#fff" font-weight="bold">مساعدة...!</text>
        `;
        break;

      case 5: // لقاء الطائر الصغير
        sceneContent = `
          <rect width="800" height="500" fill="#52b788"/>
          <path d="M0,390 Q400,330 800,390 L800,500 L0,500 Z" fill="#2d6a4f"/>
          ${cuteBird(490, 400, 1.4)}
          ${realisticTurtle(260, 410, 1.2, "walk")}
        `;
        break;

      case 6: // مساعدة الطائر وتحريره
        sceneContent = `
          <rect width="800" height="500" fill="#74c69d"/>
          <path d="M0,390 Q400,330 800,390 L800,500 L0,500 Z" fill="#52b788"/>
          ${realisticTurtle(320, 410, 1.2, "walk")}
          ${cuteBird(520, 360, 1.2, -1)}
        `;
        break;

      case 7: // هدية الريشة البراقة
        sceneContent = `
          <rect width="800" height="500" fill="#d8f3dc"/>
          <path d="M0,390 Q400,330 800,390 L800,500 L0,500 Z" fill="#74c69d"/>
          <!-- ريشة براقة -->
          <path d="M420,280 Q430,260 450,270 Q440,290 420,280 Z" fill="#ffd700"/>
          ${realisticTurtle(260, 410, 1.2, "walk")}
          ${cuteBird(550, 330, 1.2, -1)}
        `;
        break;

      case 8: // الوصول إلى جدول الماء الصافي
        sceneContent = `
          <rect width="800" height="500" fill="#1b4332"/>
          <path d="M220,0 Q420,250 120,500 L800,500 L800,0 Z" fill="#48cae4"/>
          ${realisticTurtle(100, 410, 1.2, "walk")}
        `;
        break;

      case 9: // عبور الجدول على ورقة الشجر القارب
        sceneContent = `
          <rect width="800" height="500" fill="#0077b6"/>
          <circle cx="400" cy="250" r="140" fill="#90e0ef" opacity="0.3"/>
          <path d="M300,320 Q400,280 500,320 Q400,360 300,320 Z" fill="#2d6a4f" stroke="#1b4332" stroke-width="2"/>
          ${realisticTurtle(380, 290, 1.1, "walk")}
        `;
        break;

      case 10: // الضفة الأخرى المعطرة
        sceneContent = `
          <rect width="800" height="500" fill="#0096c7"/>
          <path d="M0,300 Q400,250 800,300 L800,500 L0,500 Z" fill="#2d6a4f"/>
          <circle cx="200" cy="380" r="18" fill="#ff5964"/>
          <circle cx="600" cy="400" r="20" fill="#ffb703"/>
          ${realisticTurtle(400, 320, 1.3, "walk")}
        `;
        break;

      case 11: // لقاء الضفدع الحكيم ناصر
        sceneContent = `
          <rect width="800" height="500" fill="#52b788"/>
          <path d="M0,370 Q400,310 800,370 L800,500 L0,500 Z" fill="#2d6a4f"/>
          ${realisticTurtle(220, 410, 1.2, "walk")}
          ${cuteFrog(580, 420, 1.5, -1)}
        `;
        break;

      case 12: // حل لغز الصبر والثبات
        sceneContent = `
          <rect width="800" height="500" fill="#1b4332"/>
          ${realisticTurtle(200, 410, 1.2, "walk")}
          ${cuteFrog(600, 420, 1.5, -1)}
          <g transform="translate(400, 180)">
            <rect x="-120" y="-20" width="240" height="40" rx="10" fill="#fff"/>
            <text x="0" y="5" font-size="16" fill="#000" text-anchor="middle">الصبر والثبات والاستمرار!</text>
          </g>
        `;
        break;

      case 13: // المفتاح الذهبي
        sceneContent = `
          <rect width="800" height="500" fill="#74c69d"/>
          ${realisticTurtle(240, 410, 1.2, "walk")}
          <g transform="translate(420, 250)">
            <circle cx="0" cy="0" r="16" fill="none" stroke="#ffd700" stroke-width="4"/>
            <rect x="14" y="-3" width="35" height="6" fill="#ffd700"/>
          </g>
        `;
        break;

      case 14: // بوابة الوادي القديمة
        sceneContent = `
          <rect width="800" height="500" fill="#1b4332"/>
          <path d="M120,500 L400,60 L680,500 Z" fill="#2d6a4f"/>
          <path d="M300,500 L300,330 A100,100 0 0,1 500,330 L500,500 Z" fill="#111827"/>
          <path d="M300,500 L300,330 A100,100 0 0,1 500,330 L500,500 Z" fill="#ffd700" opacity="0.3"/>
          ${realisticTurtle(210, 420, 1.1, "walk")}
        `;
        break;

      case 15: // المغارة الدافئة المنظمة
        sceneContent = `
          <rect width="800" height="500" fill="#582f0e"/>
          <circle cx="200" cy="380" r="55" fill="#2d6a4f" opacity="0.7"/>

      case 16: // صندوق الكنز المضيء في المغارة

        sceneContent = `

          <ellipse cx="400" cy="370" rx="160" ry="65" fill="#2d6a4f" stroke="#52b788" stroke-width="3"/>

    }

    return `<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${turtleDefs}${sceneContent}</svg>`;
  }

  let currentIndex = 0;
  const sceneTitle = document.getElementById("sceneTitle");
  const sceneText = document.getElementById("sceneText");
  const imageContainer = document.getElementById("imageContainer");
  const sceneBadge = document.getElementById("sceneBadge");
  const storyProgress = document.getElementById("storyProgress");
  const progressText = document.getElementById("progressText");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnRestart = document.getElementById("btnRestart");
  const btnShare = document.getElementById("btnShare");
 
  let deferredPrompt = null;

  function renderScene(index) {
    currentIndex = index;
    const scene = storyData[currentIndex];
    
    sceneTitle.innerText = scene.title;
    sceneText.innerText = scene.text;
    imageContainer.innerHTML = generateTurtleStorySVG(currentIndex);

    const progressPercent = Math.round(((currentIndex + 1) / storyData.length) * 100);
    sceneBadge.innerText = `المشهد ${currentIndex + 1} من ${storyData.length}`;
    storyProgress.style.width = `${progressPercent}%`;
    progressText.innerText = `${progressPercent}%`;

    btnPrev.disabled = currentIndex === 0;
    if (currentIndex === storyData.length - 1) {
      btnNext.innerHTML = 'النهاية 🎉';
      btnNext.classList.replace('text-white', 'text-dark');
      btnNext.style.backgroundColor = '#ffb703';
    } else {
      btnNext.innerHTML = 'التالي <i class="bi bi-arrow-left"></i>';
      btnNext.classList.replace('text-dark', 'text-white');
      btnNext.style.backgroundColor = '#2d6a4f';
    }
  }

  btnNext.onclick = () => {
    if (currentIndex < storyData.length - 1) renderScene(currentIndex + 1);
    else renderScene(0);
  };
  btnPrev.onclick = () => { if (currentIndex > 0) renderScene(currentIndex - 1); };
  btnRestart.onclick = () => renderScene(0);

  btnShare.onclick = async () => {
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'قصة مغامرة السلحفاء سلومة',
          text: 'اقرأ قصة الأطفال التفاعلية الجديدة للسلحفاء سلومة!',
          url: window.location.href,
        });
      } catch (err) {}
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('تم النسخ بنجاح!');
    }
  };

  

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') btnNext.click();
    if (e.key === 'ArrowRight') btnPrev.click();
  });

  window.onload = () => renderScene(0);
</script>
